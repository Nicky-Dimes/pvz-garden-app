<!doctype html><html><head><meta charset="utf-8"><title>PVZ AI templates</title>
<style>html,body{margin:0;background:#fef6dd}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1536" height="1536"></canvas>
<script src="pixel.js"></script><script src="art-core.js"></script>
<script src="art-plants.js"></script><script src="art-plants2.js"></script><script src="art-plants3.js"></script><script src="art-plants4.js"></script><script src="art-plants5.js"></script><script src="art-plants6.js"></script><script src="art-plants7.js"></script><script src="art-plants8.js"></script><script src="art-plants9.js"></script><script src="art-plants10.js"></script><script src="art-plants11.js"></script><script src="art-plants12.js"></script>
<script src="art-zombies.js"></script><script src="art-zombies2.js"></script><script src="art-zombies3.js"></script><script src="art-zombies4.js"></script><script src="art-zombies5.js"></script>
<script src="art-world.js"></script><script src="art-world2.js"></script><script src="art-world3.js"></script><script src="art-aqua.js"></script><script src="art-fish.js"></script><script src="art-fish2.js"></script><script src="art-aquadecor.js"></script><script src="art-aquaworld.js"></script><script src="art-trophies.js"></script><script src="art-arcade.js"></script><script src="art-event.js"></script>
<script>
// the v2 art files index.html loads (the kit, the ChatGPT-sprite runtime and its sheets), for fix-up sheets drawn from the new art
(function () { const xhr = new XMLHttpRequest(); try { xhr.open('GET', 'index.html', false); xhr.send(); } catch (e) { return; }
  for (const m of String(xhr.responseText || '').matchAll(/src="(art-v2-[A-Za-z0-9-]+\.js)"/g)) document.write('<script src="' + m[1] + '"><\/script>'); })();
</script>
<script src="data.js"></script>
<script>
// Template sheets for the family's image app (ChatGPT): the game's CURRENT art (its identity: shapes, parts, colours) in a fixed
// grid on flat cream, no text, so each refined result can be cut back into the same cells and matched to the game's ids.
// Plants: 3 species per sheet, one per row, stages 1-2-3 left to right. Zombies: 9 per sheet. Zombosses: 4 per sheet (2x2).
// window.TPL.sheets = [{ n, kind, cols, rows, items: [{ kind, id, stage, name }] }]; TPL.render(n) draws sheet n.
(function () {
  const D = PSDATA, c = document.getElementById('c'), x = c.getContext('2d'), CREAM = '#fef6dd', S = 1536;
  const plants = Object.keys(D.PLANTS), first = ['peashooter', 'sunflower', 'chomper'];
  const order = first.concat(plants.filter(p => !first.includes(p)));
  const sheets = [];
  for (let i = 0; i < order.length; i += 3) {
    const items = []; for (const id of order.slice(i, i + 3)) for (let st = 0; st < 3; st++) items.push({ kind: 'plant', id, stage: st, name: D.PLANTS[id].names[st] });
    sheets.push({ kind: 'plants', cols: 3, rows: Math.ceil(items.length / 3), items });
  }
  const zs = Object.keys(D.ZOMBIES);
  for (let i = 0; i < zs.length; i += 9) sheets.push({ kind: 'zombies', cols: 3, rows: 3, items: zs.slice(i, i + 9).map(id => ({ kind: 'zombie', id, name: D.ZOMBIES[id].name })) });
  const bs = Object.keys(PX.BOSS_ART || {});
  for (let i = 0; i < bs.length; i += 4) sheets.push({ kind: 'bosses', cols: 2, rows: 2, items: bs.slice(i, i + 4).map(id => ({ kind: 'boss', id, name: id })) });
  sheets.forEach((s, i) => { s.n = i + 1; });
  // fix-up sheets (_ai-fixups.json): chosen characters redrawn from their CURRENT new art (useNew)
  try { const r = new XMLHttpRequest(); r.open('GET', '_ai-fixups.json', false); r.send();
    for (const f of JSON.parse(r.responseText).sheets) sheets.push({ n: f.n, kind: f.kind, cols: f.cols, rows: f.rows, useNew: !!f.useNew, items: f.items.map(([id, st]) => ({ kind: 'plant', id, stage: st, name: D.PLANTS[id].names[st] })) });
  } catch (e) { /* no fix-ups */ }
  let NEW = false;
  function sprite(it) {
    PX.useV2 && PX.useV2(NEW);
    try {
      if (it.kind === 'plant') return PX.hires(() => PX.buildPlant({ species: it.id, stage: it.stage }, { frame: 0, mouth: 'smile' }).canvas());
      if (it.kind === 'zombie') return PX.hires(() => PX.buildZombie({ zombie: it.id }, {}).canvas());
      return PX.critter(it.id, 0);
    } finally { PX.useV2 && PX.useV2(true); }
  }
  function render(n) {
    const sh = sheets.find(q => q.n === n); if (!sh) return null; NEW = !!sh.useNew;
    x.fillStyle = CREAM; x.fillRect(0, 0, S, S); x.imageSmoothingEnabled = false;
    const cw = S / sh.cols, ch = S / sh.rows;
    sh.items.forEach((it, i) => {
      const s = sprite(it), w = s.width, h = s.height; // 64x64 (k=2) or 96x96 (bosses)
      const k = Math.floor(Math.min(cw * 0.78 / w, ch * 0.78 / h));
      const cx = (i % sh.cols) * cw, cy = Math.floor(i / sh.cols) * ch;
      x.drawImage(s, Math.round(cx + (cw - w * k) / 2), Math.round(cy + ch * 0.92 - h * k), w * k, h * k); // all on one baseline
    });
    return sh;
  }
  window.TPL = { sheets, render };
  const q = new URLSearchParams(location.search); if (q.get('sheet')) { const sh = render(+q.get('sheet')); document.title = sh ? 'sheet ' + sh.n : 'none'; }
})();
</script></body></html>
