<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVZ Garden — Old vs New Characters</title>
<style>
  /* dev page, never shipped (files starting with _ are skipped by the build) */
  :root{font-family:system-ui,-apple-system,sans-serif;color:#2b2a33;background:#f7f1e3}
  body{margin:0;padding:18px 18px 40px}
  h1{font-size:22px;margin:0 0 4px}.sub{color:#5a5560;margin:0 0 16px;font-size:14px}
  h2{font-size:17px;margin:22px 0 8px}
  .row{display:grid;grid-template-columns:90px repeat(8,1fr);gap:6px;align-items:center;margin-bottom:6px}
  .row.z{grid-template-columns:90px repeat(5,1fr) 3fr}
  .hd{font-size:12px;font-weight:700;color:#6a6270;text-align:center}
  .lab{font-size:12px;font-weight:700;color:#6a6270}
  .cell{background:#cfe9a8;border-radius:10px;display:grid;place-items:center;height:136px;overflow:hidden;
    background-image:linear-gradient(45deg,#c5e29a 25%,transparent 25%),linear-gradient(-45deg,#c5e29a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c5e29a 75%),linear-gradient(-45deg,transparent 75%,#c5e29a 75%);background-size:18px 18px}
  .cell canvas{display:block}
  .anim{display:flex;gap:18px;flex-wrap:wrap}
  .anim figure{margin:0;text-align:center;font-size:12px;color:#6a6270}
  .anim .cell{width:200px;height:200px}
  #status{font-size:13px;color:#5a5560;margin-top:10px}
</style>
</head>
<body>
<h1>Old vs new: Sunflower and Basic Zombie</h1>
<p class="sub">For each pose: <b>old</b> = the game's code-drawn pixel sprite, <b>new</b> = the illustrated frame from the sprite sheet, both at the size the game shows them on an iPad garden at start zoom (128 CSS px). Live walk cycles at the bottom.</p>
<div id="grid"></div>
<h2>Walk cycles (live)</h2>
<div class="anim" id="anim"></div>
<div id="status">Loading…</div>
<script src="pixel.js"></script><script src="art-core.js"></script>
<script src="art-plants.js"></script><script src="art-plants2.js"></script><script src="art-plants3.js"></script><script src="art-plants4.js"></script><script src="art-plants5.js"></script><script src="art-plants6.js"></script><script src="art-plants7.js"></script><script src="art-plants8.js"></script><script src="art-plants9.js"></script><script src="art-plants10.js"></script><script src="art-plants11.js"></script><script src="art-plants12.js"></script>
<script src="art-zombies.js"></script><script src="art-zombies2.js"></script><script src="art-zombies3.js"></script><script src="art-zombies4.js"></script><script src="art-zombies5.js"></script>
<script src="art-world.js"></script><script src="art-world2.js"></script><script src="art-world3.js"></script><script src="art-aqua.js"></script><script src="art-fish.js"></script><script src="art-fish2.js"></script><script src="art-aquadecor.js"></script><script src="art-aquaworld.js"></script><script src="art-trophies.js"></script><script src="art-arcade.js"></script><script src="art-event.js"></script>
<script src="data.js"></script><script src="art-hd-manifest.js"></script><script src="art-hd-loader.js"></script>
<script>
(function () {
  'use strict';
  // the poses the game asks for, one per sheet frame (what art-hd-loader.js maps to that frame)
  const PLANT = { idle: { frame: 0, mouth: 'smile' }, blink: { frame: 0, mouth: 'smile', eyes: 'blink' }, walk0: { walk: true, frame: 0, mouth: 'smile' }, walk1: { walk: true, frame: 1, mouth: 'smile' },
    cheer: { arms: 'up', eyes: 'happy', mouth: 'open' }, attack: { arms: 'out', mouth: 'open', eyes: 'brave' }, hurt: { eyes: 'sad', mouth: 'o' }, knocked: { eyes: 'closed', mouth: 'o' } };
  const ZOMBIE = { idle: {}, walk0: { walk: true, frame: 0 }, walk1: { walk: true, frame: 1 }, bite: { walk: true, frame: 0, mouth: 'open' }, hurt: { eyes: 'sad', mouth: 'o' } };
  const CSS = 128, dpr = Math.min(3, window.devicePixelRatio || 1), grid = document.getElementById('grid'), anim = document.getElementById('anim'), status = document.getElementById('status');
  const cvs = [];
  function canvas(get) {
    const c = document.createElement('canvas'); c.width = c.height = Math.round(CSS * dpr); c.style.width = c.style.height = CSS + 'px';
    cvs.push({ c, get }); return c;
  }
  function draw({ c, get }) {
    const src = get(); if (!src) return; const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
    x.imageSmoothingEnabled = !!(src.hdArt); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);
  }
  function row(label, cls, poses, look) {
    const r = document.createElement('div'); r.className = 'row' + (cls ? ' ' + cls : '');
    r.innerHTML = `<div class="lab">${label}</div>`;
    for (const [name, P] of Object.entries(poses)) { const cell = document.createElement('div'); cell.className = 'cell'; cell.title = name; cell.appendChild(canvas(() => look === 'old' ? PVZ_HD.originalSprig(P.__L, P) : PX.sprig(P.__L, P))); r.appendChild(cell); }
    return r;
  }
  function header(poses, cls) { const r = document.createElement('div'); r.className = 'row' + (cls ? ' ' + cls : ''); r.innerHTML = '<div></div>' + Object.keys(poses).map(k => `<div class="hd">${k}</div>`).join(''); return r; }
  const add = (title, poses, L, cls) => {
    const h = document.createElement('h2'); h.textContent = title; grid.appendChild(h); grid.appendChild(header(poses, cls));
    const withL = Object.fromEntries(Object.entries(poses).map(([k, P]) => [k, Object.assign({ __L: L }, P)]));
    // (__L rides along in the pose object only on this page, to know which look to draw; strip it before drawing)
    for (const [k, P] of Object.entries(withL)) Object.defineProperty(P, '__L', { value: L, enumerable: false });
    grid.appendChild(row('old', cls, withL, 'old')); grid.appendChild(row('new', cls, withL, 'new'));
  };
  for (let st = 0; st < 3; st++) add(`Sunflower — stage ${st}`, PLANT, { species: 'sunflower', stage: st });
  add('Basic Zombie', ZOMBIE, { zombie: 'basic' }, 'z');
  // live walk cycles: old and new side by side
  for (const [title, L, A, B] of [['Sunflower stage 0', { species: 'sunflower', stage: 0 }, PLANT.walk0, PLANT.walk1], ['Sunflower stage 1', { species: 'sunflower', stage: 1 }, PLANT.walk0, PLANT.walk1], ['Sunflower stage 2', { species: 'sunflower', stage: 2 }, PLANT.walk0, PLANT.walk1], ['Basic Zombie', { zombie: 'basic' }, ZOMBIE.walk0, ZOMBIE.walk1]]) {
    for (const look of ['old', 'new']) {
      const f = document.createElement('figure'), cell = document.createElement('div'); cell.className = 'cell';
      const c = document.createElement('canvas'), big = 200; c.width = c.height = Math.round(big * dpr); c.style.width = c.style.height = big + 'px';
      cell.appendChild(c); f.appendChild(cell); f.appendChild(document.createTextNode(`${title} — ${look}`)); anim.appendChild(f);
      cvs.push({ c, get: () => { const P = Math.floor(performance.now() / 230) % 2 ? B : A; return look === 'old' ? PVZ_HD.originalSprig(L, P) : PX.sprig(L, P); } });
    }
  }
  function tick() { cvs.forEach(draw); const s = PVZ_HD.stats(); status.textContent = `Sheets: ${s.loaded} loaded, ${s.pending} loading, ${s.failed} failed, ${s.invalid} wrong size.`; requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
})();
</script>
</body></html>
