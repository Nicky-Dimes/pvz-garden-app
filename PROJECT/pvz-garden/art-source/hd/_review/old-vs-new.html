<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Old vs new (quick)</title>
<style>
  body{margin:0;padding:16px;font-family:system-ui,-apple-system,sans-serif;background:#f7f1e3;color:#2b2a33}
  h1{font-size:20px;margin:0 0 10px}
  .g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .pair{background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .pair b{display:block;font-size:12px;text-align:center;margin-bottom:4px;color:#5a5560}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cell{background:#bfe39a;border-radius:8px;display:grid;place-items:center;height:150px;position:relative}
  .cell span{position:absolute;top:4px;left:6px;font-size:11px;font-weight:700;color:#3d5a2a}
  .cell canvas{width:140px;height:140px;image-rendering:pixelated}
  .cell img{width:140px;height:140px}
</style></head><body>
<h1>PVZ Garden characters: old (left, today's pixel art) vs new (right, illustrated)</h1>
<div class="g" id="g"></div>
<script src="../../../pixel.js"></script><script src="../../../art-core.js"></script>
<script src="../../../art-plants.js"></script><script src="../../../art-zombies.js"></script><script src="../../../art-event.js"></script>
<script>
const PAIRS = [
  ['Sunflower · idle', { species: 'sunflower', stage: 0 }, { frame: 0, mouth: 'smile' }, '../plants/sunflower/stage-0/idle.png'],
  ['Sunflower · cheer', { species: 'sunflower', stage: 0 }, { arms: 'up', eyes: 'happy', mouth: 'open' }, '../plants/sunflower/stage-0/cheer.png'],
  ['Sunflower · attack', { species: 'sunflower', stage: 0 }, { arms: 'out', mouth: 'open', eyes: 'brave' }, '../plants/sunflower/stage-0/attack.png'],
  ['Sunflower · hurt', { species: 'sunflower', stage: 0 }, { eyes: 'sad', mouth: 'o' }, '../plants/sunflower/stage-0/hurt.png'],
  ['Twin Sunflower · idle', { species: 'sunflower', stage: 1 }, { frame: 0, mouth: 'smile' }, '../plants/sunflower/stage-1/idle.png'],
  ['Twin Sunflower · walk', { species: 'sunflower', stage: 1 }, { walk: true, frame: 1, mouth: 'smile' }, '../plants/sunflower/stage-1/walk1.png'],
  ['Sunflower Queen · idle', { species: 'sunflower', stage: 2 }, { frame: 0, mouth: 'smile' }, '../plants/sunflower/stage-2/idle.png'],
  ['Sunflower Queen · cheer', { species: 'sunflower', stage: 2 }, { arms: 'up', eyes: 'happy', mouth: 'open' }, '../plants/sunflower/stage-2/cheer.png'],
  ['Zombie · walk', { zombie: 'basic' }, { walk: true, frame: 0 }, '../zombies/basic/walk0.png'],
  ['Zombie · bite', { zombie: 'basic' }, { walk: true, frame: 0, mouth: 'open' }, '../zombies/basic/bite.png'],
];
const g = document.getElementById('g');
for (const [title, L, P, png] of PAIRS) {
  const d = document.createElement('div'); d.className = 'pair';
  d.innerHTML = `<b>${title}</b><div class="two"><div class="cell"><span>old</span><canvas width="64" height="64"></canvas></div><div class="cell"><span>new</span><img src="${png}?v=${Date.now()}"></div></div>`;
  const c = d.querySelector('canvas'), src = PX.sprig(L, P), x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, 64, 64);
  g.appendChild(d);
}
</script></body></html>
