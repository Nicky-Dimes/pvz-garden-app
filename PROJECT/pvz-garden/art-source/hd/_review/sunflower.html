<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunflower HD frames — review sheet (dev only, never shipped)</title>
<style>
  /* Dev review sheet for the illustrated Sunflower (art-source/hd/plants/sunflower/stage-N/<pose>.png).
     Views: ?view=all (default) | grid1 (all 24 at 1x) | grid2&stage=N (one stage at 2x) | game (64 + 128 px with the anchor line)
            | focus&id=0/idle (one frame at 3x, 2x, 128, 64 on checkerboard and lawn). */
  body { margin: 0; padding: 16px; background: #2f2a33; color: #f4ecdc; font: 13px/1.3 -apple-system, system-ui, sans-serif; }
  h2 { margin: 18px 0 8px; font-size: 15px; font-weight: 600; color: #ffd76a; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell span { font-size: 11px; color: #cdbfa8; }
  .chk { position: relative; background-color: #e9e4ec; background-image: linear-gradient(45deg, #cfc8d6 25%, transparent 25%), linear-gradient(-45deg, #cfc8d6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #cfc8d6 75%), linear-gradient(-45deg, transparent 75%, #cfc8d6 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
  .lawn { position: relative; background: #6fbf45; background-image: linear-gradient(90deg, rgba(0,0,0,.06) 50%, transparent 50%); background-size: 64px 64px; }
  .chk img, .lawn img { display: block; }
  .anchor::after { content: ''; position: absolute; left: 0; right: 0; top: calc(var(--s) * 248px); border-top: 1px solid rgba(220, 30, 60, .85); }
  .anchor::before { content: ''; position: absolute; top: 0; bottom: 0; left: calc(var(--s) * 128px); border-left: 1px dashed rgba(40, 90, 220, .55); }
</style>
<script>window.PS = { ui: {} }; /* lets tools/shoot_poke.mjs start without waiting for the game */</script>
</head>
<body>
<div id="app"></div>
<script>
const POSES = ['idle', 'blink', 'walk0', 'walk1', 'cheer', 'attack', 'hurt', 'knocked'];
const NAMES = ['Sunflower', 'Twin Sunflower', 'Sunflower Queen'];
const V = Date.now();
const src = (st, p) => `../plants/sunflower/stage-${st}/${p}.png?v=${V}`;
function img(st, p, size, bg = 'chk', anchor = false) {
  const s = size / 256;
  return `<div class="${bg}${anchor ? ' anchor' : ''}" style="--s:${s};width:${size}px;height:${size}px"><img src="${src(st, p)}" width="${size}" height="${size}" alt="${st}/${p}"></div>`;
}
function cell(st, p, size, bg, anchor, label = `${st}/${p}`) { return `<div class="cell">${img(st, p, size, bg, anchor)}<span>${label}</span></div>`; }
function show(o = {}) {
  const view = o.view || 'all', out = [];
  if (view === 'all' || view === 'grid1') {
    out.push('<h2>All 24 frames at 1× (256 px) on a checkerboard</h2>');
    for (let st = 0; st < 3; st++) out.push(`<div class="row">${POSES.map(p => cell(st, p, 256, 'chk', false)).join('')}</div>`);
  }
  if (view === 'all' || view === 'grid2') {
    for (const st of o.stage != null ? [+o.stage] : [0, 1, 2]) {
      out.push(`<h2>Stage ${st} · ${NAMES[st]} at 2× (512 px)</h2>`);
      out.push(`<div class="row">${POSES.map(p => cell(st, p, 512, 'chk', false)).join('')}</div>`);
    }
  }
  if (view === 'all' || view === 'game') {
    for (let st = 0; st < 3; st++) {
      out.push(`<h2>Stage ${st} · ${NAMES[st]} at game size: 64 px and 128 px (red = anchor line y 248, blue = centre x 128)</h2>`);
      out.push(`<div class="row">${POSES.map(p => cell(st, p, 64, 'chk', true, p)).join('')}</div>`);
      out.push(`<div class="row">${POSES.map(p => cell(st, p, 64, 'lawn', false, p)).join('')}</div>`);
      out.push(`<div class="row">${POSES.map(p => cell(st, p, 128, 'chk', true, p)).join('')}</div>`);
    }
  }
  if (view === 'focus') {
    const [st, p] = (o.id || '0/idle').split('/');
    out.push(`<h2>${NAMES[st]} · ${p}</h2><div class="row">${cell(st, p, 768, 'chk', false, '3×')}${cell(st, p, 512, 'lawn', false, '2× on lawn')}<div class="cell">${img(st, p, 128, 'chk', true)}${img(st, p, 128, 'lawn')}${img(st, p, 64, 'chk', true)}${img(st, p, 64, 'lawn')}<span>128 / 64</span></div></div>`);
  }
  if (view === 'strip') { // one stage's 8 poses at a given size, in a single row
    const st = +(o.stage || 0), size = +(o.size || 256);
    const list = o.poses ? String(o.poses).split(',') : POSES;
    out.push(`<h2>Stage ${st} · ${NAMES[st]} — ${size} px</h2><div class="row">${list.map(p => p.includes('/') ? cell(+p.split('/')[0], p.split('/')[1], size, o.bg || 'chk', !!o.anchor, p) : cell(st, p, size, o.bg || 'chk', !!o.anchor, p)).join('')}</div>`);
  }
  document.getElementById('app').innerHTML = out.join('');
  return new Promise(res => { const imgs = [...document.images]; let left = imgs.length; if (!left) res(0); imgs.forEach(i => { if (i.complete) { if (!--left) res(imgs.length); } else i.onload = i.onerror = () => { if (!--left) res(imgs.length); }; }); });
}
show(Object.fromEntries(new URLSearchParams(location.search)));
</script>
</body>
</html>
