<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVZ Art Studio</title>
<style>
  /* dev page, never shipped (the build skips files starting with "_"); reviews use their own storage key, never a game save */
  :root{--ink:#29243d;--soft:#655d78;--bg:#fef6dd;--card:#fffdf6;--line:#e6dcc0;--green:#2f7a3a;--red:#c4415c;--gold:#b07a12}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
  body{padding:14px 16px 40px}
  h1{font-size:21px;margin:0 0 2px;color:var(--green)} .sub{color:var(--soft);margin:0 0 12px}
  .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .bar label{display:flex;gap:6px;align-items:center} select,input[type=text],textarea{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;color:var(--ink)}
  button{font:inherit;font-weight:700;border:2px solid var(--ink);border-bottom-width:4px;border-radius:10px;padding:4px 10px;background:#fff;color:var(--ink);cursor:pointer}
  button.ok{background:#bff08a} button.no{background:#ffc2c8} button.on{background:#ffe27a}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
  .card h2{font-size:15px;margin:0 0 6px} .card h2 small{color:var(--soft);font-weight:500}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--soft)}
  canvas{image-rendering:pixelated;display:block}
  .bg-checker canvas.v{background:repeating-conic-gradient(#e9e4f2 0% 25%,#fff 0% 50%) 50%/16px 16px}
  .bg-cream canvas.v{background:#fef6dd} .bg-dark canvas.v{background:#29243d} .bg-lawn canvas.v{background:repeating-conic-gradient(#9fd86a 0% 25%,#8ccd5c 0% 50%) 50%/32px 32px}
  .ref{border-radius:8px;border:1.5px solid var(--line);background-repeat:no-repeat}
  .badge{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px;margin-left:6px}
  .b-accepted{background:#bff08a} .b-revise{background:#ffc2c8} .b-pending{background:#eee}
  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  .sheet .cell{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:4px;cursor:pointer}
  #status{margin-top:10px;color:var(--soft)}
</style>
</head>
<body>
<h1>PVZ Art Studio</h1>
<p class="sub">Old art vs the new 64-grid pixel art (and the approved reference for the master characters). Everything is drawn live from the game's art code. Reviews stay in this browser under their own key and never touch game saves.</p>
<div class="bar">
  <label>Show <select id="kind"><option value="plant">Plants</option><option value="zombie">Zombies</option><option value="boss">Zombosses</option></select></label>
  <label>Character <select id="id"></select></label>
  <label>Stage <select id="stage"><option value="0">1</option><option value="1">2</option><option value="2">3</option></select></label>
  <label>Background <select id="bg"><option value="checker">Checkerboard</option><option value="cream">Cream</option><option value="dark">Dark navy</option><option value="lawn">Lawn</option></select></label>
  <label><input type="checkbox" id="gridOn"> Pixel grid</label>
  <label><input type="checkbox" id="onion"> Onion skin (old over new)</label>
  <button id="sheetBtn">Contact sheet</button>
</div>
<div id="view"></div>
<div class="bar" style="margin-top:12px">
  <strong id="revId">—</strong>
  <textarea id="notes" rows="2" cols="60" placeholder="Notes: eyes, anatomy, palette, clusters, stage change, readability…"></textarea>
  <button class="ok" id="accept">Accept</button><button class="no" id="revise">Needs revision</button><button id="pending">Pending</button>
  <button id="export">Export reviews</button><label>Import <input type="file" id="import" accept=".json,application/json"></label>
</div>
<div id="status"></div>
<script src="pixel.js"></script><script src="art-core.js"></script>
<script src="art-plants.js"></script><script src="art-plants2.js"></script><script src="art-plants3.js"></script><script src="art-plants4.js"></script><script src="art-plants5.js"></script><script src="art-plants6.js"></script><script src="art-plants7.js"></script><script src="art-plants8.js"></script><script src="art-plants9.js"></script><script src="art-plants10.js"></script><script src="art-plants11.js"></script><script src="art-plants12.js"></script>
<script src="art-zombies.js"></script><script src="art-zombies2.js"></script><script src="art-zombies3.js"></script><script src="art-zombies4.js"></script><script src="art-zombies5.js"></script>
<script src="art-world.js"></script><script src="art-world2.js"></script><script src="art-world3.js"></script><script src="art-aqua.js"></script><script src="art-fish.js"></script><script src="art-fish2.js"></script><script src="art-aquadecor.js"></script><script src="art-aquaworld.js"></script><script src="art-trophies.js"></script><script src="art-arcade.js"></script><script src="art-event.js"></script>
<script>
// load every v2 art file listed in index.html (so new batches show up here without editing this page)
(function () { const xhr = new XMLHttpRequest(); try { xhr.open('GET', 'index.html', false); xhr.send(); } catch (e) { return; }
  const files = [...String(xhr.responseText || '').matchAll(/src="(art-v2-[A-Za-z0-9-]+\.js)"/g)].map(m => m[1]);
  for (const f of files) document.write('<script src="' + f + '"><\/script>'); })();
</script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.PSDATA, KEY = 'pvz-garden:art-studio:v2', $ = id => document.getElementById(id);
  const PLANT = [['idle', { frame: 0, mouth: 'smile' }], ['blink', { frame: 0, mouth: 'smile', eyes: 'blink' }], ['walkA', { walk: true, frame: 0, mouth: 'smile' }], ['walkB', { walk: true, frame: 1, mouth: 'smile' }],
    ['cheer', { arms: 'up', eyes: 'happy', mouth: 'open' }], ['attack', { arms: 'out', mouth: 'open', eyes: 'brave' }], ['hurt', { eyes: 'sad', mouth: 'o' }], ['knockedOut', { eyes: 'closed', mouth: 'o' }]];
  const ZOMBIE = [['idle', {}], ['walkA', { walk: true, frame: 0 }], ['walkB', { walk: true, frame: 1 }], ['bite', { walk: true, frame: 0, mouth: 'open' }], ['hurt', { eyes: 'sad', mouth: 'o' }]];
  // approved reference crops (references/01): [x, y, w, h] in the 1774x887 sheet
  const REF = { 'plant:peashooter:0': [40, 220, 130, 140], 'plant:peashooter:1': [195, 170, 170, 190], 'plant:peashooter:2': [370, 160, 200, 200],
    'plant:sunflower:0': [615, 230, 130, 130], 'plant:sunflower:1': [770, 190, 160, 170], 'plant:sunflower:2': [940, 160, 200, 200],
    'plant:chomper:0': [1195, 220, 130, 140], 'plant:chomper:1': [1355, 180, 170, 180], 'plant:chomper:2': [1535, 140, 210, 220],
    'zombie:basic': [200, 385, 140, 170], 'zombie:conehead': [1100, 370, 150, 185], 'boss:zombot:0': [175, 560, 460, 290], 'boss:plankwalker:0': [655, 560, 470, 290], 'boss:gargantuar:0': [1160, 560, 560, 290] };
  const REF_URL = '_ref/01_APPROVED_character_style_reference.png';
  let reviews = {}; try { reviews = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { reviews = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(reviews)); } catch (e) { /* private mode */ } };
  const draw = (oldArt, fn) => { const was = PX.v2On(); PX.useV2(!oldArt); try { return fn(); } finally { PX.useV2(was); } };
  function sprite(kind, id, stage, P, oldArt) {
    return draw(oldArt, () => kind === 'plant' ? PX.hires(() => PX.buildPlant({ species: id, stage }, P).canvas()) : kind === 'zombie' ? PX.hires(() => PX.buildZombie({ zombie: id }, P).canvas()) : PX.critter(id, P.f || 0));
  }
  // a canvas showing src at s CSS px per logical px (src: 64 or 96 logical px), optional grid
  function show(src, s, label, cls) {
    const w = document.createElement('div'); w.className = 'cell';
    const c = document.createElement('canvas'), R = 2; c.width = src.width * s * R; c.height = src.height * s * R; c.style.width = src.width * s + 'px'; c.style.height = src.height * s + 'px'; c.className = 'v ' + (cls || '');
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
    if ($('gridOn').checked && s >= 2) { x.strokeStyle = 'rgba(41,36,61,.18)'; x.lineWidth = 1; for (let i = 0; i <= src.width; i++) { x.beginPath(); x.moveTo(i * s * R + 0.5, 0); x.lineTo(i * s * R + 0.5, c.height); x.stroke(); } for (let j = 0; j <= src.height; j++) { x.beginPath(); x.moveTo(0, j * s * R + 0.5); x.lineTo(c.width, j * s * R + 0.5); x.stroke(); } }
    w.appendChild(c); if (label) { const t = document.createElement('span'); t.textContent = label; w.appendChild(t); } return w;
  }
  function onion(a, b, s) { // old (a) at 45% over new (b)
    const c = document.createElement('canvas'); c.width = b.width; c.height = b.height; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(b, 0, 0); x.globalAlpha = 0.45; x.drawImage(a, 0, 0, b.width, b.height); return show(c, s, 'onion skin');
  }
  const ids = kind => kind === 'plant' ? Object.keys(D.PLANTS) : kind === 'zombie' ? Object.keys(D.ZOMBIES) : Object.keys(PX.BOSS_ART || {});
  const has2 = (kind, id) => !!(kind === 'plant' ? (PX.PLANT_ART2 || {})[id] : kind === 'zombie' ? (PX.ZOMBIE_ART2 || {})[id] : (PX.BOSS_ART2 || {})[id]);
  const nameOf = (kind, id) => (kind === 'plant' ? D.PLANTS[id] && D.PLANTS[id].name : kind === 'zombie' ? D.ZOMBIES[id] && D.ZOMBIES[id].name : id) || id;
  const revKey = () => { const k = $('kind').value, id = $('id').value; return k === 'plant' ? `plant:${id}:${$('stage').value}` : `${k}:${id}`; };
  function fillIds() { const k = $('kind').value, sel = $('id'); sel.innerHTML = ''; for (const id of ids(k)) { const o = document.createElement('option'); o.value = id; o.textContent = (has2(k, id) ? '★ ' : '') + nameOf(k, id); sel.appendChild(o); } $('stage').disabled = k !== 'plant'; }
  function render() {
    const k = $('kind').value, id = $('id').value, st = +$('stage').value, view = $('view'); view.className = 'bg-' + $('bg').value; view.innerHTML = '';
    const poses = k === 'plant' ? PLANT : k === 'zombie' ? ZOMBIE : [['frame 1', { f: 0 }], ['frame 2', { f: 1 }]];
    const neu = sprite(k, id, st, poses[0][1], false), old = sprite(k, id, st, poses[0][1], true), n = neu.width / 64 > 1.2 ? 96 : 64;
    const grid = document.createElement('div'); grid.className = 'grid';
    const card = (title, nodes) => { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = `<h2>${title}</h2>`; const r = document.createElement('div'); r.className = 'row'; nodes.forEach(x => r.appendChild(x)); c.appendChild(r); grid.appendChild(c); };
    card(`New${has2(k, id) ? '' : ' <small>(no v2 drawing yet: this is the old art)</small>'}`, [show(neu, 1, '1x'), show(neu, 2, '2x'), show(neu, 4, '4x')]);
    card('Old (current game)', [show(old, 1, '1x'), show(old, 2, '2x'), show(old, 4, '4x')].concat($('onion').checked ? [onion(old, neu, 4)] : []));
    // actual sizes: the seed tray (21-32 CSS px tall) and the iPad garden at start zoom (128 CSS px frame)
    card('Actual size in the game', [show(neu, 21 / n, 'tray 21px'), show(neu, 32 / n, 'tray 32px'), show(neu, 128 / n, 'garden 128px'), show(neu, 290 / n, 'pop-up 290px')]);
    const r = REF[`${k}:${id}${k === 'plant' ? ':' + st : k === 'boss' ? ':0' : ''}`];
    if (r) { const d = document.createElement('div'); d.className = 'ref'; const sc = 1.2; d.style.width = r[2] * sc + 'px'; d.style.height = r[3] * sc + 'px'; d.style.backgroundImage = `url("${REF_URL}")`; d.style.backgroundSize = `${1774 * sc}px ${887 * sc}px`; d.style.backgroundPosition = `${-r[0] * sc}px ${-r[1] * sc}px`; const w = document.createElement('div'); w.className = 'cell'; w.appendChild(d); w.appendChild(Object.assign(document.createElement('span'), { textContent: 'approved reference' })); card('Approved reference', [w]); }
    card('All poses (new)', poses.map(([name, P]) => show(sprite(k, id, st, P, false), 2, name)));
    view.appendChild(grid); showReview();
  }
  function contact() {
    const k = $('kind').value, view = $('view'); view.className = 'bg-' + $('bg').value; view.innerHTML = '';
    const sh = document.createElement('div'); sh.className = 'sheet';
    for (const id of ids(k)) for (const st of k === 'plant' ? [0, 1, 2] : [0]) {
      const key = k === 'plant' ? `plant:${id}:${st}` : `${k}:${id}`, rv = reviews[key] || { status: 'pending' };
      const c = show(sprite(k, id, st, k === 'boss' ? { f: 0 } : (k === 'plant' ? PLANT : ZOMBIE)[0][1], false), k === 'boss' ? 0.9 : 1.3, `${nameOf(k, id)}${k === 'plant' ? ' ' + (st + 1) : ''}${has2(k, id) ? ' ★' : ''}`);
      c.title = rv.status + (rv.notes ? ': ' + rv.notes : ''); c.style.outline = rv.status === 'accepted' ? '2px solid #7ac24a' : rv.status === 'revise' ? '2px solid #e8607a' : '';
      c.onclick = () => { $('id').value = id; if (k === 'plant') $('stage').value = st; render(); window.scrollTo(0, 0); };
      sh.appendChild(c);
    }
    view.appendChild(sh); showReview();
  }
  function showReview() { const key = revKey(), rv = reviews[key] || { status: 'pending', notes: '' }; $('revId').innerHTML = `${key} <span class="badge b-${rv.status}">${rv.status}</span>`; $('notes').value = rv.notes || ''; }
  function setStatus(s) { reviews[revKey()] = { status: s, notes: $('notes').value, at: new Date().toISOString() }; save(); showReview(); }
  $('kind').onchange = () => { fillIds(); render(); }; $('id').onchange = render; $('stage').onchange = render; $('bg').onchange = render; $('gridOn').onchange = render; $('onion').onchange = render;
  $('sheetBtn').onclick = contact; $('accept').onclick = () => setStatus('accepted'); $('revise').onclick = () => setStatus('revise'); $('pending').onclick = () => setStatus('pending');
  $('export').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(reviews, null, 1)], { type: 'application/json' })); a.download = 'pvz-art-reviews.json'; a.click(); };
  $('import').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { Object.assign(reviews, JSON.parse(t)); save(); showReview(); }); };
  // ?kind=plant&id=sunflower&stage=2&sheet=1 deep links (used for screenshots)
  const q = new URLSearchParams(location.search); if (q.get('kind')) $('kind').value = q.get('kind'); fillIds(); if (q.get('id')) $('id').value = q.get('id'); if (q.get('stage')) $('stage').value = q.get('stage'); if (q.get('bg')) $('bg').value = q.get('bg');
  if (q.get('sheet')) contact(); else render();
  $('status').textContent = `v2 drawings: ${Object.keys(PX.PLANT_ART2 || {}).length} plants, ${Object.keys(PX.ZOMBIE_ART2 || {}).length} zombies, ${Object.keys(PX.BOSS_ART2 || {}).length} Zombosses.`;
})();
</script>
</body></html>
