<!doctype html><html><head><meta charset="utf-8"><title>PVZ AI slicer</title>
<style>
  body{margin:0;padding:16px;background:#fbf6e9;font:14px/1.4 system-ui,sans-serif;color:#29243d}
  h1{font-size:19px;margin:0 0 4px} p{margin:0 0 10px;color:#5a5068}
  .row{display:flex;gap:14px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
  figure{margin:0;text-align:center} figcaption{font-size:12px;color:#5a5068;margin-top:3px}
  canvas{image-rendering:pixelated;display:block;border-radius:6px}
  .lawn{background:repeating-conic-gradient(#9fd86a 0% 25%,#8ccd5c 0% 50%) 50%/32px 32px}
</style></head><body>
<h1 id="h">PVZ AI slicer</h1><p id="sub"></p><div id="out"></div>
<script>
// Cuts a ChatGPT result sheet (made from _ai-templates.html sheet n) back into its grid cells and turns every character into a
// clean 64x64 (bosses 96x96) indexed pixel sprite: cream background removed, a small palette (k-means on the character's own
// colours), each logical pixel = the MOST COMMON palette colour of its source block (no blending), dark outline -> navy PX.INK,
// eyes kept findable (dark iris + pure white shine), base on row 61, centred on x 32 (48). Result: window.RESULT (JSON).
// Use: _ai-slice.html?sheet=1&src=_ref/ai/sheet-01.png[&cols=3&rows=3]
(function () {
  const q = new URLSearchParams(location.search), sheetN = +q.get('sheet') || 1, src = q.get('src') || `_ref/ai/sheet-${String(sheetN).padStart(2, '0')}.png`;
  const OUT = '#29243d', EYE = '#24183a', WHITE = '#ffffff';
  const hex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const lum = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  function loadSpec() { // the same sheet list as the templates page (ids per cell)
    return new Promise(res => { const f = document.createElement('iframe'); f.style.display = 'none'; f.src = '_ai-templates.html'; f.onload = () => res(f.contentWindow.TPL.sheets.find(q => q.n === sheetN)); document.body.appendChild(f); });
  }
  function cellPixels(img, sh, i) {
    const cw = img.naturalWidth / sh.cols, ch = img.naturalHeight / sh.rows, x0 = Math.round((i % sh.cols) * cw), y0 = Math.round(Math.floor(i / sh.cols) * ch);
    const W = Math.round(cw), H = Math.round(ch), c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, x0, y0, W, H, 0, 0, W, H);
    return { W, H, d: x.getImageData(0, 0, W, H), canvas: c };
  }
  // background: flood fill from the cell border over colours close to the border's median colour
  function cutBackground({ W, H, d }) {
    const p = d.data, border = [];
    for (let i = 0; i < W; i += 3) border.push(i, (H - 1) * W + i); for (let j = 0; j < H; j += 3) border.push(j * W, j * W + W - 1);
    const med = k => { const v = border.map(b => p[b * 4 + k]).sort((a, b) => a - b); return v[v.length >> 1]; };
    const bg = [med(0), med(1), med(2)], far = i => Math.abs(p[i] - bg[0]) + Math.abs(p[i + 1] - bg[1]) + Math.abs(p[i + 2] - bg[2]);
    const mask = new Uint8Array(W * H), st = [];
    for (const b of border) st.push(b);
    while (st.length) { const k = st.pop(); if (mask[k]) continue; if (far(k * 4) > 70) continue; mask[k] = 1; const x = k % W, y = (k - x) / W; if (x > 0) st.push(k - 1); if (x < W - 1) st.push(k + 1); if (y > 0) st.push(k - W); if (y < H - 1) st.push(k + W); }
    // keep the biggest blob of character pixels (+ blobs at least 3% of it: separate leaves, sparkles stay out)
    const lab = new Int32Array(W * H).fill(-1), sizes = [];
    for (let k = 0; k < W * H; k++) { if (mask[k] || lab[k] >= 0) continue; const id = sizes.length; let n = 0; const s2 = [k]; lab[k] = id;
      while (s2.length) { const j = s2.pop(); n++; const x = j % W, y = (j - x) / W; for (const nb of [x > 0 ? j - 1 : -1, x < W - 1 ? j + 1 : -1, y > 0 ? j - W : -1, y < H - 1 ? j + W : -1]) if (nb >= 0 && !mask[nb] && lab[nb] < 0) { lab[nb] = id; s2.push(nb); } }
      sizes.push(n); }
    const big = Math.max(...sizes); for (let k = 0; k < W * H; k++) if (!mask[k] && sizes[lab[k]] < big * 0.03) mask[k] = 1;
    // a light halo left along the edge (anti-aliasing against the cream) goes too
    for (let pass = 0; pass < 2; pass++) for (let k = 0; k < W * H; k++) { if (mask[k]) continue; const x = k % W, y = (k - x) / W; const nearBg = (x > 0 && mask[k - 1]) || (x < W - 1 && mask[k + 1]) || (y > 0 && mask[k - W]) || (y < H - 1 && mask[k + W]); if (nearBg && far(k * 4) < 140 && lum(p[k * 4], p[k * 4 + 1], p[k * 4 + 2]) > 0.75) mask[k] = 2; }
    // ground shadows (ChatGPT sometimes paints a soft grey ellipse under a character): low-saturation, mid-light pixels joined to
    // the background in the lowest quarter of the character become background too
    { let top = H, bot = -1; for (let k = 0; k < W * H; k++) if (!mask[k]) { const y = (k / W) | 0; top = Math.min(top, y); bot = Math.max(bot, y); }
      const cut = bot - (bot - top) * 0.25, greyish = k => { const r = p[k * 4], g = p[k * 4 + 1], b = p[k * 4 + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = lum(r, g, b); return mx - mn < 40 && l > 0.42 && l < 0.9; };
      const st = []; for (let k = 0; k < W * H; k++) if (mask[k]) { const x = k % W, y = (k - x) / W; if (y < cut) continue; for (const nb of [k - 1, k + 1, k - W, k + W]) if (nb >= 0 && nb < W * H && !mask[nb] && greyish(nb)) st.push(nb); }
      while (st.length) { const k = st.pop(); if (mask[k]) continue; const y = (k / W) | 0; if (y < cut || !greyish(k)) continue; mask[k] = 3; for (const nb of [k - 1, k + 1, k - W, k + W]) if (nb >= 0 && nb < W * H && !mask[nb]) st.push(nb); } }
    // what's left of a removed shadow: its dark rim. Below the lowest row that still has real colour (not dark, not grey), dark
    // pixels go; then any small loose bits (< 3% of the biggest piece) go too
    { const dark = k => lum(p[k * 4], p[k * 4 + 1], p[k * 4 + 2]) < 0.3;
      let lastBody = -1; for (let y = H - 1; y >= 0 && lastBody < 0; y--) { let n = 0; for (let x = 0; x < W; x++) { const k = y * W + x; if (!mask[k] && !dark(k)) n++; } if (n >= 3) lastBody = y; }
      if (lastBody >= 0) for (let y = lastBody + 4; y < H; y++) for (let x = 0; x < W; x++) { const k = y * W + x; if (!mask[k] && dark(k)) mask[k] = 4; }
      const lab2 = new Int32Array(W * H).fill(-1), sz = [];
      for (let k = 0; k < W * H; k++) { if (mask[k] || lab2[k] >= 0) continue; const id = sz.length; let n = 0; const s2 = [k]; lab2[k] = id;
        while (s2.length) { const j = s2.pop(); n++; const x = j % W, y = (j - x) / W; for (const nb of [x > 0 ? j - 1 : -1, x < W - 1 ? j + 1 : -1, y > 0 ? j - W : -1, y < H - 1 ? j + W : -1]) if (nb >= 0 && !mask[nb] && lab2[nb] < 0) { lab2[nb] = id; s2.push(nb); } }
        sz.push(n); }
      const big2 = Math.max(0, ...sz); for (let k = 0; k < W * H; k++) if (!mask[k] && sz[lab2[k]] < big2 * 0.03) mask[k] = 5; }
    let x0 = W, y0 = H, x1 = -1, y1 = -1; for (let k = 0; k < W * H; k++) if (!mask[k]) { const x = k % W, y = (k - x) / W; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { mask, box: { x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 }, bg };
  }
  function kmeans(px, K) {
    let C = []; for (let i = 0; i < K; i++) C.push(px[Math.floor((i + 0.5) * px.length / K)].slice());
    for (let it = 0; it < 14; it++) {
      const acc = C.map(() => [0, 0, 0, 0]);
      for (const v of px) { let b = 0, bd = 1e9; for (let c = 0; c < C.length; c++) { const e = (C[c][0] - v[0]) ** 2 * 0.3 + (C[c][1] - v[1]) ** 2 * 0.59 + (C[c][2] - v[2]) ** 2 * 0.11; if (e < bd) { bd = e; b = c; } } v[3] = b; acc[b][0] += v[0]; acc[b][1] += v[1]; acc[b][2] += v[2]; acc[b][3]++; }
      C = C.map((c, i) => (acc[i][3] ? [acc[i][0] / acc[i][3], acc[i][1] / acc[i][3], acc[i][2] / acc[i][3]] : c));
    }
    return C;
  }
  // one character -> an indexed logical sprite of size N (64 / 96), scaled by `scale` (logical px per source px)
  function convert(cell, cut, scale, N, base) {
    const { W, d } = cell, p = d.data, { mask, box } = cut;
    const px = []; for (let y = box.y0; y <= box.y1; y++) for (let x = box.x0; x <= box.x1; x++) { const k = y * W + x; if (!mask[k]) px.push([p[k * 4], p[k * 4 + 1], p[k * 4 + 2], 0]); }
    const pal = kmeans(px, 30);
    const ow = Math.max(1, Math.round(box.w * scale)), oh = Math.max(1, Math.round(box.h * scale));
    const idx = new Int16Array(ow * oh).fill(-1);
    for (let oy = 0; oy < oh; oy++) for (let ox = 0; ox < ow; ox++) {
      const sx0 = box.x0 + Math.floor(ox / scale), sx1 = box.x0 + Math.max(Math.floor(ox / scale) + 1, Math.floor((ox + 1) / scale)), sy0 = box.y0 + Math.floor(oy / scale), sy1 = box.y0 + Math.max(Math.floor(oy / scale) + 1, Math.floor((oy + 1) / scale));
      const cnt = new Map(); let n = 0, solid = 0, dark = 0;
      for (let y = sy0; y < sy1; y++) for (let x = sx0; x < sx1; x++) { n++; const k = y * W + x; if (mask[k]) continue; solid++;
        const r = p[k * 4], g = p[k * 4 + 1], b = p[k * 4 + 2]; let best = 0, bd = 1e9; for (let c = 0; c < pal.length; c++) { const e = (pal[c][0] - r) ** 2 * 0.3 + (pal[c][1] - g) ** 2 * 0.59 + (pal[c][2] - b) ** 2 * 0.11; if (e < bd) { bd = e; best = c; } }
        cnt.set(best, (cnt.get(best) || 0) + 1); if (lum(r, g, b) < 0.16) dark++; }
      if (solid < n * 0.5) continue;
      let best = -1, bn = 0; for (const [c, k] of cnt) if (k > bn) { best = c; bn = k; }
      // a block that is a third outline counts as outline (keeps 1-px lines unbroken)
      if (dark > solid * 0.34) { let dc = -1, dl = 9; for (const [c] of cnt) { const l = lum(...pal[c]); if (l < dl) { dl = l; dc = c; } } best = dc; }
      idx[oy * ow + ox] = best;
    }
    // palette -> hex; the darkest colours become the navy outline; pure-ish whites stay pure white (shines)
    const hexes = pal.map(c => { const l = lum(...c); return l < 0.13 ? OUT : l > 0.93 && Math.max(...c) - Math.min(...c) < 24 ? WHITE : hex(...c); });
    // place on the N x N canvas: lowest row on `base`, the base's centre on N/2
    let low = -1; for (let y = oh - 1; y >= 0 && low < 0; y--) for (let x = 0; x < ow; x++) if (idx[y * ow + x] >= 0) { low = y; break; }
    let bx0 = ow, bx1 = -1; for (let y = Math.max(0, low - 3); y <= low; y++) for (let x = 0; x < ow; x++) if (idx[y * ow + x] >= 0) { bx0 = Math.min(bx0, x); bx1 = Math.max(bx1, x); }
    let dx = Math.round(N / 2 - (bx0 + bx1 + 1) / 2), dy = base - low;
    dx = Math.max(3, Math.min(N - 3 - ow, dx)); // a margin both sides: the outline + a 1-px recoil never reach the frame edge
    const grid = new Array(N * N).fill(null);
    for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) { const c = idx[y * ow + x]; if (c < 0) continue; const X = x + dx, Y = y + dy; if (X < 0 || Y < 0 || X >= N || Y >= N) continue; grid[Y * N + X] = hexes[c]; }
    // eyes stay findable: a dark blob (not the outline) touching a pure-white shine keeps a dark iris colour (not navy)
    for (let k = 0; k < N * N; k++) if (grid[k] === WHITE) for (const nb of [k - 1, k + 1, k - N, k + N]) if (grid[nb] === OUT) grid[nb] = EYE;
    // close outline gaps round the silhouette (1 px navy where a painted pixel meets empty)
    const add = []; for (let k = 0; k < N * N; k++) { if (grid[k] !== null) continue; const x = k % N, y = (k - x) / N; for (const [a, b] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) { if (a < 0 || b < 0 || a >= N || b >= N) continue; const v = grid[b * N + a]; if (v && v !== OUT && v !== EYE) { add.push(k); break; } } }
    for (const k of add) grid[k] = OUT;
    // indexed output: a palette of the colours used + one char per pixel
    const used = [...new Set(grid.filter(Boolean))], CH = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const rows = []; for (let y = 0; y < N; y++) { let s = ''; for (let x = 0; x < N; x++) { const v = grid[y * N + x]; s += v ? CH[used.indexOf(v)] : '.'; } rows.push(s); }
    return { N, palette: used, rows, scaleUsed: scale };
  }
  function toCanvas(sp) { const c = document.createElement('canvas'); c.width = sp.N; c.height = sp.N; const x = c.getContext('2d'); const CH = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    sp.rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) { if (r[i] === '.') continue; x.fillStyle = sp.palette[CH.indexOf(r[i])]; x.fillRect(i, y, 1, 1); } }); return c; }
  function show(c, s, cls) { const o = document.createElement('canvas'); o.width = c.width * s; o.height = c.height * s; o.className = cls || ''; const x = o.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, o.width, o.height); return o; }
  (async () => {
    const sh = await loadSpec(), img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
    const cols = +q.get('cols') || sh.cols, rows = +q.get('rows') || sh.rows, spec = Object.assign({}, sh, { cols, rows });
    document.getElementById('h').textContent = `Sheet ${sheetN}: ${sh.items.map(i => i.name).join(', ')}`;
    const boss = sh.kind === 'bosses', N = boss ? 96 : 64, base = boss ? 92 : 61, maxH = boss ? 88 : (sh.kind === 'zombies' ? 56 : 54), maxW = boss ? 88 : 57;
    const cells = sh.items.map((it, i) => { const cell = cellPixels(img, spec, i); return { it, cell, cut: cutBackground(cell) }; });
    // one scale for the whole sheet (same pixel density for every character): the tallest fits maxH, the widest maxW
    const scale = Math.min(...cells.map(c => maxH / c.cut.box.h), ...cells.map(c => maxW / c.cut.box.w));
    const out = document.getElementById('out'), RESULT = { sheet: sheetN, src, scale, items: [] };
    for (const { it, cell, cut } of cells) {
      const sp = convert(cell, cut, scale, N, base);
      RESULT.items.push(Object.assign({ kind: it.kind, id: it.id, stage: it.stage, name: it.name }, sp));
      const row = document.createElement('div'); row.className = 'row';
      const f = (el, cap) => { const fig = document.createElement('figure'); fig.appendChild(el); const fc = document.createElement('figcaption'); fc.textContent = cap; fig.appendChild(fc); row.appendChild(fig); };
      const srcC = document.createElement('canvas'); srcC.width = cut.box.w; srcC.height = cut.box.h; srcC.getContext('2d').drawImage(cell.canvas, cut.box.x0, cut.box.y0, cut.box.w, cut.box.h, 0, 0, cut.box.w, cut.box.h); srcC.style.height = '200px'; srcC.style.imageRendering = 'auto';
      const cv = toCanvas(sp);
      f(srcC, it.name + ': ChatGPT'); f(show(cv, 4, 'lawn'), 'game sprite 4x'); f(show(cv, 2, 'lawn'), '2x'); f(show(cv, 1, 'lawn'), '1x');
      out.appendChild(row);
    }
    document.getElementById('sub').textContent = `scale ${scale.toFixed(3)} logical px per source px; ${RESULT.items.length} sprites`;
    window.RESULT = RESULT; document.title = 'done';
  })();
})();
</script></body></html>
