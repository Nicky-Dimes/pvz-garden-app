<!-- (fonts load without blocking the first paint: the game never waits for them; the fallback faces are used until they arrive) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@500;600;700;800;900&display=swap" media="print" onload="this.media='all'">

<!-- the "Loading…" splash: removed first thing by PS.ui.boot() (app.js). If the game hasn't started after 9 s (a script failed to
     load or threw), it turns into "Tap to try again" with the first error, so the screen never sits frozen on it. -->
<div id="bootSplash" style="position:fixed;inset:0;z-index:99999;background:#78c850 repeating-linear-gradient(90deg,#78c850 0 30px,#6cbc46 30px 60px);color:#3a2d34;font:800 19px/1.35 Nunito,ui-rounded,system-ui,-apple-system,sans-serif;text-align:center"><style>@keyframes bootSpin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#bootSplash svg{animation:none!important}}</style><img src="icons/icon-192.png" width="96" height="96" alt="" aria-hidden="true" style="position:absolute;left:50%;top:50%;margin:-60px 0 0 -48px;border-radius:22px"><div id="bootMsg" style="position:absolute;left:16px;right:16px;top:calc(50% + 52px);padding:10px 16px;background:#fbf3dc;border:3px solid #3a2d34;border-radius:14px;max-width:320px;margin:0 auto">Loading P vs. Z Garden…</div></div>
<script>
(function () { // (startup safety: see the splash above; no game code here)
  var first = null;
  window.addEventListener('error', function (e) { if (!first && e && (e.message || e.error)) first = String(e.message || e.error); });
  setTimeout(function () {
    var s = document.getElementById('bootSplash'), m = document.getElementById('bootMsg'); if (!s || !m) return;
    m.innerHTML = 'The game is taking a while. <b>Tap to try again.</b>' + (first ? '<br><small style="font-weight:600;font-size:13px">' + first.slice(0, 140).replace(/[<&]/g, '') + '</small>' : '');
    s.style.cursor = 'pointer'; s.onclick = function () { location.reload(); };
  }, 9000);
})();
</script>

<body>
<div id="app">
  <header id="hud">
    <button class="player-chip" id="playerChip" aria-label="Main menu: switch player"><canvas class="px" id="playerAvatar" width="32" height="32"></canvas><span id="playerName" class="px-title">Player</span></button>
    <button class="goal-chip" id="goalChip" type="button" hidden><canvas class="px" width="16" height="16"></canvas><span></span></button>
    <div class="hud-pills">
      <div class="pill-stat" id="clockPill" title="Day and night switch every 15 minutes">
        <canvas class="px" id="clockIcon" width="9" height="9"></canvas><span id="clockText" class="num">Day</span>
      </div>
      <div class="pill-stat" id="coinPill"><canvas class="px" id="coinIcon" width="9" height="9"></canvas><span id="coinText" class="num">0</span></div>
    </div>
  </header>

  <main id="stage">
    <section class="screen" id="scr-garden" data-screen="garden"></section>
    <section class="screen" id="scr-race" data-screen="race" hidden></section>
    <section class="screen" id="scr-battle" data-screen="battle" hidden></section>
    <section class="screen" id="scr-survival" data-screen="survival" hidden></section>
    <section class="screen" id="scr-arcade" data-screen="arcade" hidden></section>
    <section class="screen" id="scr-adventure" data-screen="adventure" hidden></section>
    <section class="screen" id="scr-shop" data-screen="shop" hidden></section>
    <section class="screen" id="scr-sprouts" data-screen="sprouts" hidden></section>
    <section class="screen" id="scr-aquarium" data-screen="aquarium" hidden></section>
  </main>

  <nav id="nav" aria-label="Main">
    <button data-go="garden" aria-current="page"><canvas class="px" width="16" height="16"></canvas><span>Garden</span><i class="badge" hidden></i></button>
    <button data-go="race"><canvas class="px" width="16" height="16"></canvas><span>Race</span><i class="badge" hidden></i></button>
    <button data-go="battle"><canvas class="px" width="16" height="16"></canvas><span>Battle</span><i class="badge" hidden></i></button>
    <button data-go="arcade"><canvas class="px" width="16" height="16"></canvas><span>Arcade</span><i class="badge" hidden></i></button>
    <button data-go="shop"><canvas class="px" width="16" height="16"></canvas><span>Shop</span><i class="badge" hidden></i></button>
    <button data-go="sprouts"><canvas class="px" width="16" height="16"></canvas><span>Almanac</span><i class="badge" hidden></i></button>
    <button data-go="aquarium"><canvas class="px" width="16" height="16"></canvas><span>My Aquarium</span><i class="badge" hidden></i></button>
  </nav>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>
</div>
